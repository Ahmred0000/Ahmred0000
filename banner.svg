<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080f" />
      <stop offset="100%" stop-color="#0a0f1c" />
    </linearGradient>
    
    <!-- Cyber Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04" />
    </pattern>
    
    <!-- Glow Filter -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="65" />
    </filter>
  </defs>

  <!-- Base Layers -->
  <rect width="100%" height="100%" fill="url(#bg)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <!-- Glowing Abstract Orbs (Teal & Blue) -->
  <circle cx="150" cy="100" r="150" fill="#14b8a6" filter="url(#blur)" opacity="0.35" />
  <circle cx="1050" cy="300" r="150" fill="#3b82f6" filter="url(#blur)" opacity="0.25" />

  <!-- Premium Glassmorphism Center Card -->
  <rect x="250" y="90" width="700" height="220" rx="16" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" />
  
  <!-- Main Typography -->
  <text x="600" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">AHMED ASHRAF</text>
  
  <text x="600" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#14b8a6" text-anchor="middle" letter-spacing="5">FULL STACK DEVELOPER &amp; UI/UX DESIGNER</text>
  
  <!-- Elegant Separator Line -->
  <line x1="520" y1="240" x2="680" y2="240" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.6" />
  
  <!-- Slogan -->
  <text x="600" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-style="italic" font-weight="400" fill="#cbd5e1" text-anchor="middle" letter-spacing="1.5">Relentless Drive. Endless Evolution.</text>
</svg>
